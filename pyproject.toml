[project]
name = "hr-agentic-solution"
version = "1.1.0"
description = "HR Agentic Solution (MVP 1) - Google ADK 2.9, Gemini 3.8 Flash & Next.js Monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.60.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
eval = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mcp>=1.0.0",
    "google-cloud-aiplatform[evaluation]>=1.60.0",
    "pandas>=2.2.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
